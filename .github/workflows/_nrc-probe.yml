name: _nrc-probe (temporary)
on:
  push:
    branches: [fix/nrc-license-403]
    paths: ['scripts/_probe/**', '.github/workflows/_nrc-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - run: pip install requests
      - run: python -c "import requests,urllib3;print('requests',requests.__version__,'urllib3',urllib3.__version__)"
      - run: python scripts/_probe/nrc_probe.py
