name: Weekly Newswire Digest

on:
  schedule:
    - cron: '0 12 * * 1'   # Monday 12:00 UTC
  workflow_dispatch:
    inputs:
      test_to:
        description: 'Send only a test copy of the latest digest to this address (skips generating a new digest, skips subscribers)'
        required: false
        default: ''

jobs:
  newsletter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install python-dotenv "supabase==2.9.1" requests

      # Skipped for a test send — a preview shouldn't force this week's digest
      # into existence early; it resends whatever was last published.
      - name: Generate and publish weekly news digest
        if: ${{ github.event.inputs.test_to == '' }}
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_newsletter.py

      - name: Email the digest to subscribers
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
          NEWSLETTER_FROM:      ${{ secrets.NEWSLETTER_FROM }}
          # Repo variable (Settings → Variables), not a secret. Unset → the
          # script falls back to the vercel.app URL. Set it when the custom
          # domain lands so unsubscribe links ride the canonical host.
          SITE_URL:             ${{ vars.SITE_URL }}
          # Passed as an env var, not interpolated into the shell line, so a
          # workflow_dispatch input can never be read as shell syntax.
          TEST_TO:              ${{ github.event.inputs.test_to }}
        run: |
          if [ -n "$TEST_TO" ]; then
            python scripts/send_newsletter.py --test-to "$TEST_TO"
          else
            python scripts/send_newsletter.py
          fi
