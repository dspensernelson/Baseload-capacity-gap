name: Repo Keepalive

# GitHub disables all scheduled workflows after 60 days without repository
# activity — which would silently kill every data cron AND the watchdog that
# is supposed to notice. A bot commit counts as activity and resets the clock,
# so this monthly heartbeat makes the automation self-sustaining.
on:
  schedule:
    - cron: '0 6 15 * *'   # 15th of each month, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Commit heartbeat
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: keepalive heartbeat (prevents scheduled-workflow auto-disable)"
          git push
