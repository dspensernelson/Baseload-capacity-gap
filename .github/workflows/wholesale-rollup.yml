name: Wholesale Price Rollup

on:
  schedule:
    - cron: '0 6 * * 0'   # Sunday 06:00 UTC — roll aged real-time prices up to hourly
  workflow_dispatch:

jobs:
  rollup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install python-dotenv "supabase==2.9.1"

      - name: Roll real-time wholesale prices up to hourly
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/rollup_wholesale_prices.py
